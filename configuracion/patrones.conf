# ============================================================
# patrones.conf - Reglas de deteccion para el monitoreo de logs
# Proyecto Final - Shell Scripting - IDAT 2026-I
# Grupo: Santos, Juarez, Chavez, Taboada
# ============================================================
# Formato: SEVERIDAD|regex_fuente|regex_linea|descripcion
# Las severidades van en ingles (CRITICAL, HIGH, MEDIUM, LOW)
# porque es el estandar que manejan la mayoria de herramientas.
# Las descripciones estan en espanol para que el reporte
# se entienda sin necesidad de traducir.

CRITICAL|auth|Failed password|Intento fallido de autenticacion
CRITICAL|auth|root login denied|Acceso root denegado
HIGH|auth|invalid user|Usuario invalido detectado
HIGH|app|database unavailable|Base de datos no disponible
HIGH|app|ERROR|Error de aplicacion
MEDIUM|app|WARN|Advertencia operativa
MEDIUM|.*|timeout|Tiempo de espera excedido
LOW|.*|deprecated|Uso de configuracion obsoleta